services:
  - type: web
    runtime: docker
    name: ktm-ride-api-java
    rootDir: backend-java
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_SCHEMA
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: PASSWORD_RESET_URL_BASE
        value: https://ridepulse-web.onrender.com/#/reset-password
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
  - type: web
    runtime: static
    name: ridepulse-web
    buildCommand: cd web && npm ci && npm run build:render
    staticPublishPath: web/dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: WEB_API_BASE_URL
        value: https://ktm-ride-mvp-java.onrender.com/api
      - key: WEB_GOOGLE_MAPS_API_KEY
        sync: false
      - key: WEB_APK_URL
        value: https://github.com/KVK666/ride-pulse/releases/tag/latest

services:
  - type: web
    runtime: node
    name: ktm-ride-api
    rootDir: backend
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
  - type: web
    runtime: static
    name: ridepulse-web
    buildCommand: cd web && npm ci && npm run build:render
    staticPublishPath: web/dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: WEB_API_BASE_URL
        value: https://ktm-ride-mvp.onrender.com/api
      - key: WEB_GOOGLE_MAPS_API_KEY
        sync: false
      - key: WEB_APK_URL
        value: https://github.com/KVK666/ktm-ride-mvp/releases/tag/latest

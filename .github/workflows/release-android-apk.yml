name: Publish Latest Android APK

on:
  push:
    branches:
      - ride-pulse
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-apk
  cancel-in-progress: true

jobs:
  publish-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prebuilt APK
        run: |
          test -s releases/Duke-Ride-latest.apk
          unzip -t releases/Duke-Ride-latest.apk >/dev/null

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp releases/Duke-Ride-latest.apk dist/Duke-Ride-latest.apk
          APK_SHA256="$(sha256sum dist/Duke-Ride-latest.apk | cut -d ' ' -f 1)"
          {
            echo "Latest locally built Android APK"
            echo ""
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- APK SHA-256: ${APK_SHA256}"
            echo "- Published: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > dist/release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duke-Ride-latest-apk
          path: dist/Duke-Ride-latest.apk
          if-no-files-found: error

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push origin latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Duke Ride Latest APK" --notes-file dist/release-notes.md --latest
            gh release upload latest dist/Duke-Ride-latest.apk --clobber
          else
            gh release create latest dist/Duke-Ride-latest.apk --title "Duke Ride Latest APK" --notes-file dist/release-notes.md --latest
          fi

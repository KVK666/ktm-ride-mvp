name: Release Android APK

on:
  push:
    branches:
      - ktm-ride-mvp
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-apk
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_API_BASE_URL: https://duke-ride-api.dukeride-kvk.workers.dev/api
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Verify required secrets
        run: |
          if [ -z "${GOOGLE_MAPS_API_KEY}" ]; then
            echo "::error::Repository secret GOOGLE_MAPS_API_KEY is required for Android release builds."
            exit 1
          fi

      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleRelease -x lint -x test --configure-on-demand --build-cache -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk dist/Duke-Ride-latest.apk
          {
            echo "Automated Android APK build"
            echo ""
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Built: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > dist/release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duke-Ride-latest-apk
          path: dist/Duke-Ride-latest.apk
          if-no-files-found: error

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push origin latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Duke Ride Latest APK" --notes-file dist/release-notes.md --latest
            gh release upload latest dist/Duke-Ride-latest.apk --clobber
          else
            gh release create latest dist/Duke-Ride-latest.apk --title "Duke Ride Latest APK" --notes-file dist/release-notes.md --latest
          fi

server:
  port: ${PORT:4001}

spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  application:
    name: ridepulse-api-java
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

ridepulse:
  cors-origin: ${CORS_ORIGIN:*}
  jwt-secret: ${JWT_SECRET:}
  jwt-expires-in: ${JWT_EXPIRES_IN:30d}
  password-reset-url-base: ${PASSWORD_RESET_URL_BASE:}

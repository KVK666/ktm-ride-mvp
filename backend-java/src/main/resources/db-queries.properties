sql.user.insert=insert into users (email, password_hash, name, bike_model) values (:email, :passwordHash, :name, :bikeModel)
sql.user.insert.pojo=AuthUserRow
sql.user.by-email=select id, email, password_hash, name, bike_model, profile_photo_data is not null as has_profile_photo, profile_photo_updated_at from users where email = :email
sql.user.by-email.pojo=AuthUserRow
sql.user.by-id=select id, email, null as password_hash, name, bike_model, profile_photo_data is not null as has_profile_photo, profile_photo_updated_at from users where id = cast(:userId as uuid)
sql.user.by-id.pojo=AuthUserRow

sql.password-reset.user-by-email=select id, email, name from users where email = :email
sql.password-reset.user-by-email.pojo=ResetUserRow
sql.password-reset.mark-existing-used=update password_reset_tokens set used_at = now() where user_id = cast(:userId as uuid) and used_at is null
sql.password-reset.insert=insert into password_reset_tokens (user_id, token_hash, expires_at) values (cast(:userId as uuid), :tokenHash, cast(:expiresAt as timestamptz))
sql.password-reset.valid-token=select id, user_id from password_reset_tokens where token_hash = :tokenHash and used_at is null and expires_at > now() for update
sql.password-reset.valid-token.pojo=ResetTokenRow
sql.password-reset.update-password=update users set password_hash = :passwordHash where id = cast(:userId as uuid)
sql.password-reset.mark-token-used=update password_reset_tokens set used_at = now() where id = cast(:tokenId as uuid)

sql.ride.select=select r.id, r.start_label as start_label, r.end_label as end_label, r.start_latitude as start_latitude, r.start_longitude as start_longitude, r.end_latitude as end_latitude, r.end_longitude as end_longitude, r.distance_m as distance_m, r.duration_s as duration_s, r.top_speed_kmh as top_speed_kmh, r.avg_speed_kmh as avg_speed_kmh, r.title, r.notes, r.reviewed_at as reviewed_at, r.started_at as started_at, r.ended_at as ended_at, r.created_at as created_at, r.ai_title, r.ai_summary, r.ride_kind, r.ride_kind_confidence, r.ride_kind_reason, r.key_insight, r.best_moment, r.trip_suggestion::text as trip_suggestion, r.ai_status, r.ai_generated_at from rides r
sql.ride.select.pojo=RideRow
sql.ride.list-base=where r.user_id = cast(:userId as uuid)
sql.ride.list-today=and r.started_at >= date_trunc('day', now())
sql.ride.list-month=and r.started_at >= date_trunc('month', now())
sql.ride.list-year=and r.started_at >= date_trunc('year', now())
sql.ride.list-search=and (:searchQuery = '' or lower(coalesce(r.title, '')) like :searchPattern or lower(coalesce(r.notes, '')) like :searchPattern or lower(coalesce(r.start_label, '')) like :searchPattern or lower(coalesce(r.end_label, '')) like :searchPattern)
sql.ride.list-order=order by r.started_at desc limit 100
sql.ride.by-owner=where r.user_id = cast(:userId as uuid) and r.id = cast(:rideId as uuid)
sql.ride.exists=select true from rides where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)
sql.ride.points-full=select latitude, longitude, altitude_m, accuracy_m, speed_kmh, recorded_at from ride_points where ride_id = cast(:rideId as uuid) order by recorded_at asc
sql.ride.points-full.pojo=RidePointRow
sql.ride.points-intelligence=select latitude, longitude, null as altitude_m, null as accuracy_m, speed_kmh, recorded_at from ride_points where ride_id = cast(:rideId as uuid) order by recorded_at asc
sql.ride.points-intelligence.pojo=RidePointRow
sql.ride.intelligence-stats=select coalesce(sum(distance_m) filter (where started_at >= date_trunc('month', now())), 0) as month_distance_m, coalesce(max(distance_m), 0) as longest_ride_distance_m from rides where user_id = cast(:userId as uuid)
sql.ride.duplicates=with source_ride as (select * from rides where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)) ${sql.ride.select} join source_ride source on r.user_id = source.user_id and r.id <> source.id and r.started_at = source.started_at and r.ended_at = source.ended_at and r.distance_m = source.distance_m and r.duration_s = source.duration_s and r.start_latitude = source.start_latitude and r.start_longitude = source.start_longitude and r.end_latitude = source.end_latitude and r.end_longitude = source.end_longitude order by r.created_at asc, r.id asc
sql.ride.duplicates.pojo=RideRow
sql.ride.patch=update rides set title = :title, notes = :notes, reviewed_at = case when :markReviewed then coalesce(reviewed_at, now()) else reviewed_at end where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid) returning id, title, notes, reviewed_at
sql.ride.insert=insert into rides (user_id, start_label, end_label, start_latitude, start_longitude, end_latitude, end_longitude, distance_m, duration_s, top_speed_kmh, avg_speed_kmh, client_ride_id, started_at, ended_at) values (cast(:userId as uuid), :startLabel, :endLabel, :startLatitude, :startLongitude, :endLatitude, :endLongitude, :distanceM, :durationS, :topSpeedKmh, :avgSpeedKmh, :clientRideId, cast(:startedAt as timestamptz), cast(:endedAt as timestamptz))
sql.ride.insert-point=insert into ride_points (ride_id, latitude, longitude, altitude_m, accuracy_m, speed_kmh, recorded_at) values (cast(:rideId as uuid), :latitude, :longitude, :altitudeM, :accuracyM, :speedKmh, cast(:recordedAt as timestamptz))
sql.ride.by-client-id=select id, distance_m, duration_s, top_speed_kmh, avg_speed_kmh from rides where user_id = cast(:userId as uuid) and client_ride_id = :clientRideId
sql.ride.by-client-id.pojo=RideDuplicateRow
sql.ride.delete=delete from rides where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)
sql.ride.ai-mark-pending=update rides set ai_status = 'pending' where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid) and coalesce(ai_status, '') <> 'ready'
sql.ride.ai-save=update rides set ai_title = :aiTitle, ai_summary = :aiSummary, ride_kind = :rideKind, ride_kind_confidence = :rideKindConfidence, ride_kind_reason = :rideKindReason, key_insight = :keyInsight, best_moment = :bestMoment, trip_suggestion = cast(:tripSuggestion as jsonb), ai_status = :aiStatus, ai_generated_at = now() where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)

sql.ride-photo.list=select id, ride_id, file_name, mime_type, image_data, created_at, imported_at, latitude, longitude, has_location from ride_album_photos where ride_id = cast(:rideId as uuid) and user_id = cast(:userId as uuid) order by imported_at desc, created_at desc
sql.ride-photo.list.pojo=RidePhotoRow
sql.ride-photo.insert=insert into ride_album_photos (ride_id, user_id, image_data, mime_type, file_name, created_at, imported_at, latitude, longitude, has_location) values (cast(:rideId as uuid), cast(:userId as uuid), :imageData, :mimeType, :fileName, cast(:createdAt as timestamptz), cast(:importedAt as timestamptz), :latitude, :longitude, :hasLocation)
sql.ride-photo.insert.pojo=RidePhotoRow
sql.ride-photo.by-id=select id, ride_id, file_name, mime_type, image_data, created_at, imported_at, latitude, longitude, has_location from ride_album_photos where id = cast(:photoId as uuid) and ride_id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)
sql.ride-photo.by-id.pojo=RidePhotoRow
sql.ride-photo.delete=delete from ride_album_photos where id = cast(:photoId as uuid) and ride_id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)

sql.route-preview=with numbered as (select ride_id, latitude, longitude, row_number() over (partition by ride_id order by recorded_at) as point_number, count(*) over (partition by ride_id) as point_count from ride_points where ride_id in (:rideIds)) select ride_id, latitude, longitude from numbered where point_number = 1 or point_number = point_count or mod(point_number - 1, greatest(1, cast(ceil(point_count / 46.0) as int))) = 0 order by ride_id, point_number
sql.route-preview.pojo=RoutePreviewPointRow

sql.stats.dashboard=select coalesce(sum(distance_m) filter (where started_at >= date_trunc('day', now())), 0) as today_distance_m, coalesce(sum(distance_m) filter (where started_at >= date_trunc('month', now())), 0) as month_distance_m, coalesce(sum(distance_m) filter (where started_at >= date_trunc('year', now())), 0) as year_distance_m, coalesce(sum(distance_m) filter (where started_at >= date_trunc('month', now()) - interval '1 month' and started_at < date_trunc('month', now())), 0) as previous_month_distance_m, coalesce(max(distance_m), 0) as longest_ride_distance_m, count(*)::int as total_rides, count(*) filter (where reviewed_at is null)::int as unreviewed_rides, coalesce(max(top_speed_kmh), 0) as best_top_speed_kmh, coalesce(avg(avg_speed_kmh), 0) as average_speed_kmh from rides where user_id = cast(:userId as uuid)
sql.stats.dashboard.pojo=DashboardStatsRow
sql.dashboard.recent=${sql.ride.select} where r.user_id = cast(:userId as uuid) order by r.started_at desc limit 5
sql.dashboard.recent.pojo=RideRow
sql.journal.recent=${sql.ride.select} where r.user_id = cast(:userId as uuid) order by r.started_at desc limit :limit
sql.journal.recent.pojo=RideRow
sql.journal.month=${sql.ride.select} where r.user_id = cast(:userId as uuid) and r.started_at >= date_trunc('month', now()) order by r.distance_m desc limit :limit
sql.journal.month.pojo=RideRow

sql.analytics.distance=select * from (select date_trunc(:grain, started_at) as bucket, coalesce(sum(distance_m), 0) as distance_m, count(*)::int as ride_count, coalesce(sum(duration_s), 0) as duration_s, coalesce(max(top_speed_kmh), 0) as top_speed_kmh, coalesce(avg(nullif(avg_speed_kmh, 0)), 0) as avg_speed_kmh from rides where user_id = cast(:userId as uuid) group by 1 order by 1 desc limit 60) recent order by bucket asc
sql.analytics.distance.pojo=DistanceBucketRow
sql.analytics.speed=select speed_kmh, recorded_at from ride_points where ride_id = cast(:rideId as uuid) order by recorded_at asc
sql.analytics.speed.pojo=SpeedPointRow
sql.analytics.insight-rides=select distance_m, duration_s, top_speed_kmh, reviewed_at, started_at from rides where user_id = cast(:userId as uuid)
sql.analytics.insight-rides.pojo=AnalyticsInsightRideRow

sql.reports.summary=select count(*)::int as ride_count, coalesce(sum(distance_m), 0) as distance_m, coalesce(sum(duration_s), 0) as duration_s, coalesce(avg(avg_speed_kmh), 0) as avg_speed_kmh, coalesce(max(top_speed_kmh), 0) as top_speed_kmh from rides where user_id = cast(:userId as uuid) and started_at >= date_trunc(:grain, cast(:anchor as timestamptz)) and started_at < date_trunc(:grain, cast(:anchor as timestamptz)) + ('1 ' || :grain)::interval
sql.reports.summary.pojo=ReportSummaryRow
sql.reports.routes=select start_label, end_label, distance_m, duration_s, top_speed_kmh, started_at from rides where user_id = cast(:userId as uuid) and started_at >= date_trunc(:grain, cast(:anchor as timestamptz)) and started_at < date_trunc(:grain, cast(:anchor as timestamptz)) + ('1 ' || :grain)::interval order by started_at asc
sql.reports.routes.pojo=ReportRouteRow

sql.profile.photo=select profile_photo_data, profile_photo_mime, profile_photo_updated_at from users where id = cast(:userId as uuid)
sql.profile.photo.pojo=PhotoRow
sql.profile.update-photo=update users set profile_photo_data = :imageData, profile_photo_mime = :mimeType, profile_photo_updated_at = now() where id = cast(:userId as uuid) returning profile_photo_data is not null as has_profile_photo, profile_photo_updated_at
sql.profile.update-photo.pojo=PhotoMetadataRow
sql.profile.delete-photo=update users set profile_photo_data = null, profile_photo_mime = null, profile_photo_updated_at = null where id = cast(:userId as uuid) returning profile_photo_data is not null as has_profile_photo, profile_photo_updated_at
sql.profile.delete-photo.pojo=PhotoMetadataRow

sql.saved-place.list=select id, label, kind, latitude, longitude, radius_m, created_at, updated_at from saved_places where user_id = cast(:userId as uuid) order by case kind when 'home' then 0 when 'office' then 1 else 2 end, lower(label)
sql.saved-place.by-id=select id, label, kind, latitude, longitude, radius_m, created_at, updated_at from saved_places where user_id = cast(:userId as uuid) and id = cast(:placeId as uuid)
sql.saved-place.count=select count(*)::int from saved_places where user_id = cast(:userId as uuid)
sql.saved-place.insert=insert into saved_places (user_id, label, kind, latitude, longitude, radius_m) values (cast(:userId as uuid), :label, :kind, :latitude, :longitude, :radiusM) returning id, label, kind, latitude, longitude, radius_m, created_at, updated_at
sql.saved-place.update=update saved_places set label = :label, kind = :kind, latitude = :latitude, longitude = :longitude, radius_m = :radiusM, updated_at = now() where user_id = cast(:userId as uuid) and id = cast(:placeId as uuid) returning id, label, kind, latitude, longitude, radius_m, created_at, updated_at
sql.saved-place.delete=delete from saved_places where user_id = cast(:userId as uuid) and id = cast(:placeId as uuid)

sql.trip.list=select t.id, t.title, t.description, t.cover_ride_id, t.created_at, t.updated_at, count(tr.ride_id)::int as ride_count, coalesce(sum(r.distance_m), 0) as distance_m, min(r.started_at) as started_at, max(coalesce(r.ended_at, r.started_at)) as ended_at from trips t left join trip_rides tr on tr.trip_id = t.id left join rides r on r.id = tr.ride_id and r.user_id = t.user_id where t.user_id = cast(:userId as uuid) group by t.id, t.title, t.description, t.cover_ride_id, t.created_at, t.updated_at order by t.updated_at desc, t.created_at desc
sql.trip.by-id=select t.id, t.title, t.description, t.cover_ride_id, t.created_at, t.updated_at, count(tr.ride_id)::int as ride_count, coalesce(sum(r.distance_m), 0) as distance_m, min(r.started_at) as started_at, max(coalesce(r.ended_at, r.started_at)) as ended_at from trips t left join trip_rides tr on tr.trip_id = t.id left join rides r on r.id = tr.ride_id and r.user_id = t.user_id where t.user_id = cast(:userId as uuid) and t.id = cast(:tripId as uuid) group by t.id, t.title, t.description, t.cover_ride_id, t.created_at, t.updated_at
sql.trip.rides=${sql.ride.select} join trip_rides tr on tr.ride_id = r.id where tr.trip_id = cast(:tripId as uuid) and r.user_id = cast(:userId as uuid) order by tr.sort_order asc, tr.added_at asc, r.started_at desc
sql.trip.insert=insert into trips (user_id, title, description) values (cast(:userId as uuid), :title, :description) returning id
sql.trip.update=update trips set title = :title, description = :description, updated_at = now() where id = cast(:tripId as uuid) and user_id = cast(:userId as uuid)
sql.trip.delete=delete from trips where id = cast(:tripId as uuid) and user_id = cast(:userId as uuid)
sql.trip.add-ride=insert into trip_rides (trip_id, ride_id, sort_order) values (cast(:tripId as uuid), cast(:rideId as uuid), coalesce((select max(sort_order) + 1 from trip_rides where trip_id = cast(:tripId as uuid)), 0)) on conflict (trip_id, ride_id) do nothing
sql.trip.remove-ride=delete from trip_rides where trip_id = cast(:tripId as uuid) and ride_id = cast(:rideId as uuid)
sql.trip.touch=update trips set updated_at = now() where id = cast(:tripId as uuid) and user_id = cast(:userId as uuid)

sql.schema.uuid-extension=create extension if not exists "uuid-ossp"
sql.schema.pgcrypto-extension=create extension if not exists pgcrypto
sql.schema.user-profile-data=alter table users add column if not exists profile_photo_data bytea
sql.schema.user-profile-mime=alter table users add column if not exists profile_photo_mime text
sql.schema.user-profile-updated=alter table users add column if not exists profile_photo_updated_at timestamptz
sql.schema.users-id-unique-index=create unique index if not exists users_id_unique_idx on users(id)
sql.schema.users-reconcile-public=do $$ begin if to_regclass('public.users') is not null and 'users'::regclass <> 'public.users'::regclass then insert into users (id, email, password_hash, name, bike_model) select source.id, source.email, source.password_hash, source.name, source.bike_model from public.users source where not exists (select 1 from users target where target.id = source.id); end if; end $$
sql.schema.password-reset-table=create table if not exists password_reset_tokens (id uuid primary key default uuid_generate_v4(), user_id uuid not null references users(id) on delete cascade, token_hash text not null unique, expires_at timestamptz not null, used_at timestamptz, created_at timestamptz not null default now())
sql.schema.password-reset-user-fk=do $$ begin if not exists (select 1 from pg_constraint where conrelid = 'password_reset_tokens'::regclass and contype = 'f' and conkey = array[(select attnum from pg_attribute where attrelid = 'password_reset_tokens'::regclass and attname = 'user_id')]::smallint[] and confrelid = 'users'::regclass) then alter table password_reset_tokens drop constraint if exists password_reset_tokens_user_id_fkey; alter table password_reset_tokens add constraint password_reset_tokens_user_id_fkey foreign key (user_id) references users(id) on delete cascade not valid; end if; end $$
sql.schema.ride-album-table=create table if not exists ride_album_photos (id uuid primary key default uuid_generate_v4(), ride_id uuid not null references rides(id) on delete cascade, user_id uuid not null references users(id) on delete cascade, image_data bytea not null, mime_type text not null, file_name text, created_at timestamptz not null default now(), imported_at timestamptz not null default now(), latitude numeric(10, 7), longitude numeric(10, 7), has_location boolean not null default false)
sql.schema.trips-table=create table if not exists trips (id uuid primary key default uuid_generate_v4(), user_id uuid not null references users(id) on delete cascade, title text not null, description text, cover_ride_id uuid references rides(id) on delete set null, created_at timestamptz not null default now(), updated_at timestamptz not null default now())
sql.schema.trip-rides-table=create table if not exists trip_rides (trip_id uuid not null references trips(id) on delete cascade, ride_id uuid not null references rides(id) on delete cascade, sort_order integer not null default 0, added_at timestamptz not null default now(), primary key (trip_id, ride_id))
sql.schema.saved-places-table=create table if not exists saved_places (id uuid primary key default uuid_generate_v4(), user_id uuid not null references users(id) on delete cascade, label text not null, kind text not null default 'other', latitude numeric(10, 7) not null, longitude numeric(10, 7) not null, radius_m integer not null default 180, created_at timestamptz not null default now(), updated_at timestamptz not null default now())
sql.schema.saved-places-user-fk=do $$ begin if not exists (select 1 from pg_constraint where conrelid = 'saved_places'::regclass and contype = 'f' and conkey = array[(select attnum from pg_attribute where attrelid = 'saved_places'::regclass and attname = 'user_id')]::smallint[] and confrelid = 'users'::regclass) then alter table saved_places drop constraint if exists saved_places_user_id_fkey; alter table saved_places add constraint saved_places_user_id_fkey foreign key (user_id) references users(id) on delete cascade not valid; end if; end $$
sql.schema.ride-ai-title=alter table rides add column if not exists ai_title text
sql.schema.ride-ai-summary=alter table rides add column if not exists ai_summary text
sql.schema.ride-kind=alter table rides add column if not exists ride_kind text
sql.schema.ride-kind-confidence=alter table rides add column if not exists ride_kind_confidence numeric(4, 3)
sql.schema.ride-kind-reason=alter table rides add column if not exists ride_kind_reason text
sql.schema.ride-key-insight=alter table rides add column if not exists key_insight text
sql.schema.ride-best-moment=alter table rides add column if not exists best_moment text
sql.schema.ride-trip-suggestion=alter table rides add column if not exists trip_suggestion jsonb
sql.schema.ride-ai-status=alter table rides add column if not exists ai_status text not null default 'fallback'
sql.schema.ride-ai-generated-at=alter table rides add column if not exists ai_generated_at timestamptz
sql.schema.password-reset-user-index=create index if not exists password_reset_tokens_user_idx on password_reset_tokens(user_id, created_at desc)
sql.schema.password-reset-expires-index=create index if not exists password_reset_tokens_expires_idx on password_reset_tokens(expires_at)
sql.schema.ride-photo-ride-index=create index if not exists ride_album_photos_ride_imported_idx on ride_album_photos(ride_id, imported_at desc)
sql.schema.ride-photo-user-index=create index if not exists ride_album_photos_user_idx on ride_album_photos(user_id, imported_at desc)
sql.schema.trips-user-index=create index if not exists trips_user_updated_idx on trips(user_id, updated_at desc)
sql.schema.trip-rides-ride-index=create index if not exists trip_rides_ride_idx on trip_rides(ride_id, added_at desc)
sql.schema.saved-places-user-label-index=create unique index if not exists saved_places_user_label_idx on saved_places(user_id, lower(label))
sql.schema.rides-user-started-index=create index if not exists rides_user_started_idx on rides(user_id, started_at desc)

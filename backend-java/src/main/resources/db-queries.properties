sql.user.insert=insert into users (email, password_hash, name, bike_model) values (:email, :passwordHash, :name, :bikeModel)
sql.user.insert.pojo=AuthUserRow
sql.user.by-email=select id, email, password_hash, name, bike_model, profile_photo_data is not null as has_profile_photo, profile_photo_updated_at from users where email = :email
sql.user.by-email.pojo=AuthUserRow
sql.user.by-id=select id, email, null as password_hash, name, bike_model, profile_photo_data is not null as has_profile_photo, profile_photo_updated_at from users where id = cast(:userId as uuid)
sql.user.by-id.pojo=AuthUserRow

sql.password-reset.user-by-email=select id, email, name from users where email = :email
sql.password-reset.user-by-email.pojo=ResetUserRow
sql.password-reset.mark-existing-used=update password_reset_tokens set used_at = now() where user_id = cast(:userId as uuid) and used_at is null
sql.password-reset.insert=insert into password_reset_tokens (user_id, token_hash, expires_at) values (cast(:userId as uuid), :tokenHash, cast(:expiresAt as timestamptz))
sql.password-reset.valid-token=select id, user_id from password_reset_tokens where token_hash = :tokenHash and used_at is null and expires_at > now() for update
sql.password-reset.valid-token.pojo=ResetTokenRow
sql.password-reset.update-password=update users set password_hash = :passwordHash where id = cast(:userId as uuid)
sql.password-reset.mark-token-used=update password_reset_tokens set used_at = now() where id = cast(:tokenId as uuid)

sql.ride.select=select r.id, r.start_label as start_label, r.end_label as end_label, r.start_latitude as start_latitude, r.start_longitude as start_longitude, r.end_latitude as end_latitude, r.end_longitude as end_longitude, r.distance_m as distance_m, r.duration_s as duration_s, r.top_speed_kmh as top_speed_kmh, r.avg_speed_kmh as avg_speed_kmh, r.title, r.notes, r.reviewed_at as reviewed_at, r.started_at as started_at, r.ended_at as ended_at, r.created_at as created_at, r.source, r.source_activity_type, r.speed_data_quality, r.ai_title, r.ai_summary, r.ride_kind, r.ride_kind_confidence, r.ride_kind_reason, r.key_insight, r.best_moment, r.trip_suggestion::text as trip_suggestion, r.ai_status, r.ai_generated_at, r.destination_name, r.destination_category, r.destination_address, r.destination_source, r.ai_context_version from rides r
sql.ride.select.pojo=RideRow
sql.ride.list-base=where r.user_id = cast(:userId as uuid)
sql.ride.list-today=and r.started_at >= date_trunc('day', now())
sql.ride.list-month=and r.started_at >= date_trunc('month', now())
sql.ride.list-year=and r.started_at >= date_trunc('year', now())
sql.ride.list-date-range=and (cast(:startedFrom as timestamptz) is null or r.started_at >= cast(:startedFrom as timestamptz)) and (cast(:startedBefore as timestamptz) is null or r.started_at < cast(:startedBefore as timestamptz))
sql.ride.list-search=and (:searchQuery = '' or lower(coalesce(r.title, '')) like :searchPattern or lower(coalesce(r.notes, '')) like :searchPattern or lower(coalesce(r.start_label, '')) like :searchPattern or lower(coalesce(r.end_label, '')) like :searchPattern or lower(coalesce(r.ai_title, '')) like :searchPattern or lower(coalesce(r.ai_summary, '')) like :searchPattern or lower(coalesce(r.ride_kind, '')) like :searchPattern or lower(coalesce(r.key_insight, '')) like :searchPattern or lower(coalesce(r.source_activity_type, '')) like :searchPattern or lower(coalesce(r.source, '')) like :searchPattern)
sql.ride.list-needs-review=and r.reviewed_at is null
sql.ride.list-cleanup=and r.reviewed_at is null and ((coalesce(r.distance_m, 0) <= 100 and coalesce(r.duration_s, 0) <= 180) or (coalesce(r.distance_m, 0) <= 250 and coalesce(r.duration_s, 0) <= 60))
sql.ride.list-cursor-newest=and (r.started_at, r.id) < (cast(:cursorStartedAt as timestamptz), cast(:cursorRideId as uuid))
sql.ride.list-cursor-longest=and (coalesce(r.distance_m, 0), r.started_at, r.id) < (:cursorSortValue, cast(:cursorStartedAt as timestamptz), cast(:cursorRideId as uuid))
sql.ride.list-cursor-fastest=and (coalesce(r.top_speed_kmh, 0), r.started_at, r.id) < (:cursorSortValue, cast(:cursorStartedAt as timestamptz), cast(:cursorRideId as uuid))
sql.ride.list-order-newest=order by r.started_at desc, r.id desc
sql.ride.list-order-longest=order by coalesce(r.distance_m, 0) desc, r.started_at desc, r.id desc
sql.ride.list-order-fastest=order by coalesce(r.top_speed_kmh, 0) desc, r.started_at desc, r.id desc
sql.ride.list-limit=limit :fetchLimit
sql.ride.list-order=order by r.started_at desc limit 100
sql.ride.by-owner=where r.user_id = cast(:userId as uuid) and r.id = cast(:rideId as uuid)
sql.ride.exists=select true from rides where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)
sql.ride.owned-ids=select id::text from rides where user_id = cast(:userId as uuid) and id::text in (:rideIds)
sql.ride.points-full=select latitude, longitude, altitude_m, accuracy_m, speed_kmh, recorded_at from ride_points where ride_id = cast(:rideId as uuid) order by recorded_at asc
sql.ride.points-full.pojo=RidePointRow
sql.ride.points-intelligence=select latitude, longitude, null as altitude_m, null as accuracy_m, speed_kmh, recorded_at from ride_points where ride_id = cast(:rideId as uuid) order by recorded_at asc
sql.ride.points-intelligence.pojo=RidePointRow
sql.ride.intelligence-stats=select coalesce(sum(distance_m) filter (where started_at >= date_trunc('month', now())), 0) as month_distance_m, coalesce(max(distance_m), 0) as longest_ride_distance_m from rides where user_id = cast(:userId as uuid)
sql.ride.duplicates=with source_ride as (select * from rides where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)) ${sql.ride.select} join source_ride source on r.user_id = source.user_id and r.id <> source.id and r.started_at = source.started_at and r.ended_at = source.ended_at and r.distance_m = source.distance_m and r.duration_s = source.duration_s and r.start_latitude = source.start_latitude and r.start_longitude = source.start_longitude and r.end_latitude = source.end_latitude and r.end_longitude = source.end_longitude order by r.created_at asc, r.id asc
sql.ride.duplicates.pojo=RideRow
sql.ride.patch=update rides set title = :title, notes = :notes, reviewed_at = case when :markReviewed then coalesce(reviewed_at, now()) else reviewed_at end where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid) returning id, title, notes, reviewed_at
sql.ride.insert=insert into rides (user_id, start_label, end_label, start_latitude, start_longitude, end_latitude, end_longitude, distance_m, duration_s, top_speed_kmh, avg_speed_kmh, client_ride_id, started_at, ended_at, reviewed_at, source, source_activity_type, speed_data_quality, ai_status) values (cast(:userId as uuid), :startLabel, :endLabel, :startLatitude, :startLongitude, :endLatitude, :endLongitude, :distanceM, :durationS, :topSpeedKmh, :avgSpeedKmh, :clientRideId, cast(:startedAt as timestamptz), cast(:endedAt as timestamptz), case when :markReviewed then now() else null end, coalesce(:source, 'ridepulse'), :sourceActivityType, :speedDataQuality, coalesce(:aiStatus, 'fallback')) on conflict (user_id, client_ride_id) where client_ride_id is not null do nothing returning id
sql.ride.import-insert=insert into rides (user_id, start_label, end_label, start_latitude, start_longitude, end_latitude, end_longitude, distance_m, duration_s, top_speed_kmh, avg_speed_kmh, client_ride_id, started_at, ended_at, reviewed_at, source, source_activity_type, speed_data_quality, ai_status) values (cast(:userId as uuid), :startLabel, :endLabel, :startLatitude, :startLongitude, :endLatitude, :endLongitude, :distanceM, :durationS, :topSpeedKmh, :avgSpeedKmh, :clientRideId, cast(:startedAt as timestamptz), cast(:endedAt as timestamptz), now(), 'google_timeline', :sourceActivityType, :speedDataQuality, 'deferred') on conflict (user_id, client_ride_id) where client_ride_id is not null do nothing returning id
sql.ride.insert-point=insert into ride_points (ride_id, latitude, longitude, altitude_m, accuracy_m, speed_kmh, recorded_at) values (cast(:rideId as uuid), :latitude, :longitude, :altitudeM, :accuracyM, :speedKmh, cast(:recordedAt as timestamptz))
sql.ride.by-client-id=select id, distance_m, duration_s, top_speed_kmh, avg_speed_kmh from rides where user_id = cast(:userId as uuid) and client_ride_id = :clientRideId
sql.ride.by-client-id.pojo=RideDuplicateRow
sql.ride.owned-by-client-ids=select id, client_ride_id from rides where user_id = cast(:userId as uuid) and client_ride_id in (:clientRideIds)
sql.ride.overlaps=select id, started_at, ended_at, client_ride_id from rides where user_id = cast(:userId as uuid) and started_at < cast(:endedAt as timestamptz) and coalesce(ended_at, started_at) > cast(:startedAt as timestamptz) order by started_at asc, id asc limit 20
sql.ride.overlaps-range=select id, started_at, ended_at, client_ride_id from rides where user_id = cast(:userId as uuid) and started_at < cast(:endedAt as timestamptz) and coalesce(ended_at, started_at) > cast(:startedAt as timestamptz) order by started_at asc, id asc
sql.ride.delete=delete from rides where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)
sql.ride.ai-save=update rides set ai_title = :aiTitle, ai_summary = :aiSummary, ride_kind = :rideKind, ride_kind_confidence = :rideKindConfidence, ride_kind_reason = :rideKindReason, key_insight = :keyInsight, best_moment = :bestMoment, trip_suggestion = cast(:tripSuggestion as jsonb), ai_status = :aiStatus, ai_generated_at = now(), destination_name = :destinationName, destination_category = :destinationCategory, destination_address = :destinationAddress, destination_source = :destinationSource, ai_context_version = :aiContextVersion where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)

sql.ride-photo.list=select id, ride_id, file_name, mime_type, image_data, created_at, imported_at, latitude, longitude, has_location from ride_album_photos where ride_id = cast(:rideId as uuid) and user_id = cast(:userId as uuid) order by imported_at desc, created_at desc
sql.ride-photo.list-metadata=select id, ride_id, file_name, mime_type, created_at, imported_at, latitude, longitude, has_location from ride_album_photos where ride_id = cast(:rideId as uuid) and user_id = cast(:userId as uuid) order by imported_at desc, created_at desc
sql.ride-photo.list.pojo=RidePhotoRow
sql.ride-photo.insert=insert into ride_album_photos (id, ride_id, user_id, image_data, mime_type, file_name, created_at, imported_at, latitude, longitude, has_location, client_photo_id) values (gen_random_uuid(), cast(:rideId as uuid), cast(:userId as uuid), :imageData, :mimeType, :fileName, cast(:createdAt as timestamptz), cast(:importedAt as timestamptz), :latitude, :longitude, :hasLocation, :clientPhotoId) on conflict (user_id, ride_id, client_photo_id) where client_photo_id is not null do update set client_photo_id = excluded.client_photo_id returning id
sql.ride-photo.insert.pojo=RidePhotoRow
sql.ride-photo.by-id=select id, ride_id, file_name, mime_type, image_data, created_at, imported_at, latitude, longitude, has_location from ride_album_photos where id = cast(:photoId as uuid) and ride_id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)
sql.ride-photo.binary-by-id=select image_data as profile_photo_data, mime_type as profile_photo_mime, imported_at as profile_photo_updated_at from ride_album_photos where id = cast(:photoId as uuid) and ride_id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)
sql.ride-photo.by-id.pojo=RidePhotoRow
sql.ride-photo.delete=delete from ride_album_photos where id = cast(:photoId as uuid) and ride_id = cast(:rideId as uuid) and user_id = cast(:userId as uuid)

sql.route-preview=with numbered as (select ride_id, latitude, longitude, row_number() over (partition by ride_id order by recorded_at) as point_number, count(*) over (partition by ride_id) as point_count from ride_points where ride_id in (:rideIds)) select ride_id, latitude, longitude from numbered where point_number = 1 or point_number = point_count or mod(point_number - 1, greatest(1, cast(ceil(point_count / 46.0) as int))) = 0 order by ride_id, point_number
sql.route-preview.pojo=RoutePreviewPointRow

sql.stats.dashboard=select coalesce(sum(distance_m) filter (where started_at >= date_trunc('day', now())), 0) as today_distance_m, coalesce(sum(distance_m) filter (where started_at >= date_trunc('month', now())), 0) as month_distance_m, coalesce(sum(distance_m) filter (where started_at >= date_trunc('year', now())), 0) as year_distance_m, coalesce(sum(distance_m) filter (where started_at >= date_trunc('month', now()) - interval '1 month' and started_at < date_trunc('month', now())), 0) as previous_month_distance_m, coalesce(max(distance_m), 0) as longest_ride_distance_m, count(*)::int as total_rides, count(*) filter (where reviewed_at is null)::int as unreviewed_rides, coalesce(max(top_speed_kmh), 0) as best_top_speed_kmh, coalesce(avg(avg_speed_kmh), 0) as average_speed_kmh from rides where user_id = cast(:userId as uuid)
sql.stats.dashboard.pojo=DashboardStatsRow
sql.dashboard.recent=${sql.ride.select} where r.user_id = cast(:userId as uuid) order by r.started_at desc limit 5
sql.dashboard.recent.pojo=RideRow
sql.journal.recent=${sql.ride.select} where r.user_id = cast(:userId as uuid) order by r.started_at desc limit :limit
sql.journal.recent.pojo=RideRow
sql.journal.month=${sql.ride.select} where r.user_id = cast(:userId as uuid) and r.started_at >= date_trunc('month', now()) order by r.distance_m desc limit :limit
sql.journal.month.pojo=RideRow

sql.analytics.distance=select * from (select date_trunc(:grain, started_at) as bucket, coalesce(sum(distance_m), 0) as distance_m, count(*)::int as ride_count, coalesce(sum(duration_s), 0) as duration_s, coalesce(max(top_speed_kmh), 0) as top_speed_kmh, coalesce(avg(nullif(avg_speed_kmh, 0)), 0) as avg_speed_kmh from rides where user_id = cast(:userId as uuid) group by 1 order by 1 desc limit 60) recent order by bucket asc
sql.analytics.distance.pojo=DistanceBucketRow
sql.analytics.speed=select speed_kmh, recorded_at from ride_points where ride_id = cast(:rideId as uuid) order by recorded_at asc
sql.analytics.speed.pojo=SpeedPointRow
sql.analytics.insight-rides=select distance_m, duration_s, top_speed_kmh, reviewed_at, started_at from rides where user_id = cast(:userId as uuid)
sql.analytics.insight-rides.pojo=AnalyticsInsightRideRow

sql.reports.summary=select count(*)::int as ride_count, coalesce(sum(distance_m), 0) as distance_m, coalesce(sum(duration_s), 0) as duration_s, coalesce(avg(avg_speed_kmh), 0) as avg_speed_kmh, coalesce(max(top_speed_kmh), 0) as top_speed_kmh from rides where user_id = cast(:userId as uuid) and started_at >= date_trunc(:grain, cast(:anchor as timestamptz)) and started_at < date_trunc(:grain, cast(:anchor as timestamptz)) + ('1 ' || :grain)::interval
sql.reports.summary.pojo=ReportSummaryRow
sql.reports.routes=select id, title, ai_title, start_label, end_label, distance_m, duration_s, top_speed_kmh, started_at from rides where user_id = cast(:userId as uuid) and started_at >= date_trunc(:grain, cast(:anchor as timestamptz)) and started_at < date_trunc(:grain, cast(:anchor as timestamptz)) + ('1 ' || :grain)::interval order by started_at asc
sql.reports.routes.pojo=ReportRouteRow

sql.profile.photo=select profile_photo_data, profile_photo_mime, profile_photo_updated_at from users where id = cast(:userId as uuid)
sql.profile.photo.pojo=PhotoRow
sql.profile.update-photo=update users set profile_photo_data = :imageData, profile_photo_mime = :mimeType, profile_photo_updated_at = now() where id = cast(:userId as uuid) returning profile_photo_data is not null as has_profile_photo, profile_photo_updated_at
sql.profile.update-photo.pojo=PhotoMetadataRow
sql.profile.delete-photo=update users set profile_photo_data = null, profile_photo_mime = null, profile_photo_updated_at = null where id = cast(:userId as uuid) returning profile_photo_data is not null as has_profile_photo, profile_photo_updated_at
sql.profile.delete-photo.pojo=PhotoMetadataRow
sql.profile.update=update users set name = case when :updateName then :name else name end, bike_model = case when :updateBikeModel then :bikeModel else bike_model end where id = cast(:userId as uuid) returning id, email, null as password_hash, name, bike_model, profile_photo_data is not null as has_profile_photo, profile_photo_updated_at
sql.profile.preferences=select coalesce(monthly_distance_goal_km, 0)::int as monthly_distance_goal_km from users where id = cast(:userId as uuid)
sql.profile.update-preferences=update users set monthly_distance_goal_km = :monthlyDistanceGoalKm where id = cast(:userId as uuid) returning monthly_distance_goal_km

sql.saved-place.list=select id, label, kind, latitude, longitude, radius_m, created_at, updated_at from saved_places where user_id = cast(:userId as uuid) order by case kind when 'home' then 0 when 'office' then 1 else 2 end, lower(label)
sql.saved-place.by-id=select id, label, kind, latitude, longitude, radius_m, created_at, updated_at from saved_places where user_id = cast(:userId as uuid) and id = cast(:placeId as uuid)
sql.saved-place.count=select count(*)::int from saved_places where user_id = cast(:userId as uuid)
sql.saved-place.insert=insert into saved_places (user_id, label, kind, latitude, longitude, radius_m) values (cast(:userId as uuid), :label, :kind, :latitude, :longitude, :radiusM) returning id, label, kind, latitude, longitude, radius_m, created_at, updated_at
sql.saved-place.update=update saved_places set label = :label, kind = :kind, latitude = :latitude, longitude = :longitude, radius_m = :radiusM, updated_at = now() where user_id = cast(:userId as uuid) and id = cast(:placeId as uuid) returning id, label, kind, latitude, longitude, radius_m, created_at, updated_at
sql.saved-place.delete=delete from saved_places where user_id = cast(:userId as uuid) and id = cast(:placeId as uuid)

sql.trip.list=select t.id, t.title, t.description, t.client_trip_id, t.cover_ride_id, t.created_at, t.updated_at, count(tr.ride_id)::int as ride_count, coalesce(sum(r.distance_m), 0) as distance_m, min(r.started_at) as started_at, max(coalesce(r.ended_at, r.started_at)) as ended_at from trips t left join trip_rides tr on tr.trip_id = t.id left join rides r on r.id = tr.ride_id and r.user_id = t.user_id where t.user_id = cast(:userId as uuid) group by t.id, t.title, t.description, t.client_trip_id, t.cover_ride_id, t.created_at, t.updated_at order by t.updated_at desc, t.created_at desc
sql.trip.by-id=select t.id, t.title, t.description, t.client_trip_id, t.cover_ride_id, t.created_at, t.updated_at, count(tr.ride_id)::int as ride_count, coalesce(sum(r.distance_m), 0) as distance_m, min(r.started_at) as started_at, max(coalesce(r.ended_at, r.started_at)) as ended_at from trips t left join trip_rides tr on tr.trip_id = t.id left join rides r on r.id = tr.ride_id and r.user_id = t.user_id where t.user_id = cast(:userId as uuid) and t.id = cast(:tripId as uuid) group by t.id, t.title, t.description, t.client_trip_id, t.cover_ride_id, t.created_at, t.updated_at
sql.trip.rides=${sql.ride.select} join trip_rides tr on tr.ride_id = r.id where tr.trip_id = cast(:tripId as uuid) and r.user_id = cast(:userId as uuid) order by tr.sort_order asc, tr.added_at asc, r.started_at desc
sql.trip.insert=insert into trips (id, user_id, title, description) values (gen_random_uuid(), cast(:userId as uuid), :title, :description) returning id
sql.trip.by-client-id=select t.id, t.title, t.description, t.client_trip_id from trips t where t.user_id = cast(:userId as uuid) and t.client_trip_id = :clientTripId
sql.trip.import-insert=insert into trips (id, user_id, title, description, client_trip_id) values (gen_random_uuid(), cast(:userId as uuid), :title, :description, :clientTripId) on conflict (user_id, client_trip_id) where client_trip_id is not null do nothing returning id
sql.trip.update=update trips set title = :title, description = :description, updated_at = now() where id = cast(:tripId as uuid) and user_id = cast(:userId as uuid)
sql.trip.delete=delete from trips where id = cast(:tripId as uuid) and user_id = cast(:userId as uuid)
sql.trip.add-ride=insert into trip_rides (trip_id, ride_id, sort_order) values (cast(:tripId as uuid), cast(:rideId as uuid), coalesce((select max(sort_order) + 1 from trip_rides where trip_id = cast(:tripId as uuid)), 0)) on conflict (trip_id, ride_id) do nothing
sql.trip.remove-ride=delete from trip_rides where trip_id = cast(:tripId as uuid) and ride_id = cast(:rideId as uuid)
sql.trip.touch=update trips set updated_at = now() where id = cast(:tripId as uuid) and user_id = cast(:userId as uuid)
sql.trip.list-for-ride=select t.id, t.title, t.description, t.client_trip_id, t.cover_ride_id, t.created_at, t.updated_at, count(all_tr.ride_id)::int as ride_count, coalesce(sum(r.distance_m), 0) as distance_m, min(r.started_at) as started_at, max(coalesce(r.ended_at, r.started_at)) as ended_at from trips t join trip_rides membership on membership.trip_id = t.id and membership.ride_id = cast(:rideId as uuid) left join trip_rides all_tr on all_tr.trip_id = t.id left join rides r on r.id = all_tr.ride_id and r.user_id = t.user_id where t.user_id = cast(:userId as uuid) group by t.id, t.title, t.description, t.client_trip_id, t.cover_ride_id, t.created_at, t.updated_at order by t.updated_at desc, t.created_at desc


sql.ride-ai.enqueue=update rides set ai_status = 'pending', ai_lease_until = null, ai_job_token = null where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid) and coalesce(ai_status, '') <> 'pending' and (coalesce(ai_status, '') <> 'ready' or coalesce(ai_context_version, 0) < :contextVersion)
sql.ride-ai.claim=with candidate as (select id from rides where ai_status = 'pending' and (ai_lease_until is null or ai_lease_until < now()) order by ai_lease_until nulls first, created_at limit 1 for update skip locked) update rides r set ai_lease_until = now() + interval '5 minutes', ai_job_token = gen_random_uuid() from candidate c where r.id = c.id returning r.id, r.user_id, r.ai_job_token
sql.ride-ai.lock=select id from rides where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid) and ai_status = 'pending' and ai_job_token = cast(:token as uuid) for update
sql.ride-ai.complete=update rides set ai_lease_until = null, ai_job_token = null where id = cast(:rideId as uuid) and user_id = cast(:userId as uuid) and ai_job_token = cast(:token as uuid)
